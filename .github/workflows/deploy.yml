name: Deploy RecipeTempo Web App

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App Clean
        run: |
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK=1 npx expo export --platform web --output-dir dist --clear
          
          # Find any generated HTML file in dist and bring it to root as index.html
          FOUND_HTML=$(find ./dist -name "*.html" | head -n 1)
          if [ -n "$FOUND_HTML" ] && [ "$FOUND_HTML" != "./dist/index.html" ]; then
            cp "$FOUND_HTML" ./dist/index.html
          fi

          # Ensure 404.html exists for client-side routing fallback
          if [ -f "./dist/index.html" ]; then
            cp ./dist/index.html ./dist/404.html
          fi
          
          touch ./dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist