name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install
- name: Build Web App
        run: |
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK=1 npm run build:web
          
          # Dynamically create an index.html if Expo didn't output one, injecting the actual built JS bundle
          if [ ! -f "./dist/index.html" ]; then
            JS_BUNDLE=$(find ./dist/_expo/static/js/web -name "index-*.js" -exec basename {} \; | head -n 1)
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"/><title>RecipeTempo</title></head><body><div id="root"></div><script src="./_expo/static/js/web/'$JS_BUNDLE'"></script></body></html>' > ./dist/index.html
          fi
          
          cp ./dist/index.html ./dist/404.html
          touch ./dist/.nojekyll
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist