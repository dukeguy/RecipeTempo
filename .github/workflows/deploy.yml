name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: |
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK=1 npm run build:web
          # Expo Router static export creates an index.html inside the route folders or root dist directory
          # Find the main index.html or copy any generated html file to serve as 404 fallback
          find ./dist -name "index.html" -exec cp {} ./dist/404.html \;

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist